services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 10

  ml-service:
    build: ./ml-service
    restart: unless-stopped
    environment:
      MODEL_PATH: /models/best_model.pth
    volumes:
      - model_data:/models
    ports:
      - "8000:8000"

  server:
    build: ./server
    restart: unless-stopped
    depends_on:
      mongo:
        condition: service_healthy
      ml-service:
        condition: service_started
    environment:
      NODE_ENV: production
      PORT: 5000
      MONGODB_URI: mongodb://mongo:27017/patho
      CORS_ORIGINS: http://localhost:5173
      ML_SERVICE_URL: http://ml-service:8000
      LOG_LEVEL: info
    volumes:
      - uploads_data:/app/uploads
    ports:
      - "5000:5000"

  client:
    build:
      context: ./client
      args:
        VITE_API_BASE_URL: http://localhost:5000/api/v1
    restart: unless-stopped
    depends_on:
      - server
    ports:
      - "5173:80"

volumes:
  mongo_data:
  uploads_data:
  model_data:
